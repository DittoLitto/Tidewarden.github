name: Build Tidewarden APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p proj
          unzip -q tidewarden-android.zip -d proj
          D=$(dirname "$(find proj -name settings.gradle | head -1)")
          echo "PROJ=$D" >> "$GITHUB_ENV"
          echo "Project folder: $D"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: cd "$PROJ" && gradle --no-daemon assembleDebug

      - name: Collect APK
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" Tidewarden.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tidewarden-apk
          path: Tidewarden.apk

      - name: Publish release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Tidewarden.apk \
            --title "Tidewarden build ${{ github.run_number }}" \
            --notes "Debug APK. Tap Tidewarden.apk below to download, then open it to install."
